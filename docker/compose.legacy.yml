# 旧環境: PHP 5.0.5 + Apache 2.0 + ODBC + SQLite 2（本番 Symfoware の代用）
#   docker compose -f docker/compose.legacy.yml up -d --build
#   http://localhost:8050/
name: php505-legacy
services:
  web:
    build: ./legacy
    # etch イメージは amd64 のみ（Apple Silicon ではエミュレーションで動く）
    platform: linux/amd64
    ports:
      - "8050:80"
    volumes:
      - ../app:/var/www/app
      - ../db:/var/www/db:ro
