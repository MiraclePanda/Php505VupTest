# 新環境: PHP 8.5 + Apache 2.4 + ODBC + SQLite 3（本番 Symfoware の代用）
#   docker compose -f docker/compose.modern.yml up -d --build
#   http://localhost:8085/
#   既定では移行後のアプリ（newapp/app）を動かす。移行前のアプリを動かすなら APP_DIR=../app を付ける。
name: php505-modern
services:
  web:
    build: ./modern
    ports:
      - "8085:80"
    volumes:
      - ${APP_DIR:-../newapp/app}:/var/www/app
      - ../newapp:/var/www/newapp:ro
      - ../db:/var/www/db:ro
