# 新環境: PHP 8.5 + Apache 2.4 + ODBC + SQLite 3（本番 Symfoware の代用）
#   docker compose -f docker/compose.modern.yml up -d --build
#   http://localhost:8085/
name: php505-modern
services:
  web:
    build: ./modern
    ports:
      - "8085:80"
    volumes:
      - ../app:/var/www/app
      - ../db:/var/www/db:ro
